[package]
name = "netcup-offer-bot"
version = "2.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "netcup-offer-bot"

# The two generators, and nothing else. `terrace-config/schema` links `serde_json` and compiles
# a derive macro over every config struct, which is weight an image that will never print a table
# has no reason to carry — so the container's runtime stage builds with default features, and the
# feature is turned on only by the documentation job and by the builder stage that writes the
# config contract.
[features]
config-schema = ["terrace-config/schema"]

# Declared so `cargo clippy --all-targets --features config-schema` keeps the generators
# compiling; `required-features` is what keeps them out of every build that does not ask for them.
[[example]]
name = "readme-variables"
required-features = ["config-schema"]

[[example]]
name = "config-contract"
required-features = ["config-schema"]

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
thiserror = "2.0.18"
backtrace = "0.3.76"
sentry = { version = "0.49.1", default-features = false, features = ["anyhow", "debug-images", "reqwest", "rustls", "backtrace", "tracing"] }
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }
rss = { version = "2.0.12", features = ["validation"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls", "stream", "gzip"] }
reqwest-middleware = "0.5.0"
reqwest-tracing = "0.7.0"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
# `derive` spelled out rather than inherited: the config structs derive `Deserialize`, and
# relying on another dependency to have enabled the feature makes this crate stop compiling
# the day that dependency drops it.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
prometheus = { version = "0.14.0", features = ["process"] }
prometheus_exporter = "0.8.5"
secrecy = { version = "0.10.3", features = ["serde"] }
# The layered loader: struct defaults, TOML, prefixed environment, a secrets directory and
# `_FILE` indirection, so a mounted Kubernetes `Secret` can supply the webhook URL instead of an
# environment variable.
#
# `explain` rides along because it costs no dependency at all — it is a second walk of the
# layers and the strings that render it — and it answers the one question this deployment
# actually gets asked: why a webhook mounted from a `Secret` is not the one being used. The boot
# log prints it at `DEBUG`, so an operator turning the level up gets the answer without a
# debugger.
#
# `reload` is deliberately absent: the supervisor would link notify, and rebuilding the runtime
# is not usable here while the Prometheus exporter binds its socket process-globally. `schema`
# is absent for the same kind of reason and arrives through the `config-schema` feature above,
# which the container never enables.
#
# Pinned by tag, not branch: `cargo update` cannot then move the dependency silently.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.6.0", default-features = false, features = ["loader", "explain"] }

[dev-dependencies]
# The same dependency as above with its test harness added, not a second copy: cargo unions the
# features for test builds. `testing` derives every name it writes from the loader the harness
# was built over, so a test cannot go on asserting a variable this crate has stopped reading.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.6.0", default-features = false, features = ["testing"] }
tempfile = "=3.27.0"
serde_test = "=1.0.177"
wiremock = "=0.6.5"

[profile.release]
lto = true
codegen-units = 1
# Sentry only needs function names, file names and line numbers to symbolicate
# stack frames, all of which "limited" keeps. Full debug info additionally emits
# a DW_TAG_variable for every static; under fat LTO the statics themselves are
# constant-folded away, leaving .debug_info/.debug_aranges relocations against
# symbols no object file defines and an "undefined reference to
# `encoding_rs::UTF_8'" failure when ld links the musl binary.
debug = "limited"