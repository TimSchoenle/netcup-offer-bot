name: Docs

# `README.md` and `docs/CONFIGURATION.md` are generated from the templates in
# `.github/templates/`. This workflow is what makes that claim true in both directions.
#
# On a pull request it renders both templates and commits the result to the branch, so nothing
# either page quotes is ever edited by hand: not the release its `docker run` examples pin, and
# not the configuration tables, which are derived from the `Config` type by the
# `readme-variables` example. The case that matters most is the release-please pull request —
# that commit is the one which changes `version` in `Cargo.toml`, so it is also the one where the
# README would otherwise start advertising the previous release. Rendering here means the
# released README already pins the version the merge is about to publish.
#
# Everywhere it cannot commit — a push to `master`, a pull request from a fork — it renders in
# `check` mode instead, writing nothing and failing if either committed file is stale. Without
# it, editing a generated page directly would appear to work right up until the next pull request
# silently reverted it.
#
# The same pull request render also rewrites `docs/config.contract.json` with `just contract-json`,
# and commits it. It is a function of `Config` and of the terrace-config release that renders it,
# so a dependency bump moves it with no source change at all — and without this, every such bump
# sat red on `Config Contract` until someone ran the recipe by hand. The reverse gate is not here:
# it is the `Config Contract` job in build.yaml, which runs on every event and therefore also
# covers `master` and forks.
#
# The Dockerfile's `terrace-config:labels` region is deliberately not written here, as in
# TankoVault and discord-alertmanager. It holds three constants that move only with a deliberate
# prefix change, and a bot editing the build recipe is a change nobody reviewed. `Config Contract`
# reports a drift, and `just regenerate` locally is the fix.
#
# The pull request half is two jobs. `render` runs the generators, which means running the pull
# request's code, so it holds no secret and only uploads what they wrote as a patch.
# `render-commit` holds the App token, executes nothing from the branch, and commits that patch
# only when every path in it is one of the three generated files.

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

# Shared with the `fmt-commit` job in build.yaml rather than scoped to this workflow: both commit
# to the pull request branch, and the API call that makes a verified commit rejects one whose
# parent has moved. Two writers racing would leave one of them failing for no reason a reader
# could act on, so they queue instead. `cancel-in-progress: false` for the same reason — a
# cancelled run here means a branch left holding a half-generated file.
concurrency:
  group: branch-writes-${{ github.event.pull_request.head.repo.full_name || github.repository }}:${{ github.event.pull_request.head.ref || github.ref_name }}
  queue: max
  cancel-in-progress: false

permissions: {}

jobs:
  render:
    name: Render
    # Forks get no secrets, so the commit half below could not mint a token and their branch is not
    # in this repository anyway. `check` below picks those pull requests up instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This half runs the pull request's code — the generator examples behind the payload and
    # `just contract-json` — so it holds no secret and no write token. It writes the regenerated
    # files into its own checkout and uploads them as a patch; `render-commit` below commits that
    # patch without running anything from the branch.
    permissions:
      contents: read # Required to checkout the code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The pull request head, not the merge commit: the render has to read the `Cargo.toml` and
      # the `Config` the pull request proposes, and the patch is committed to the branch, so it has
      # to be computed against the commit the branch points at. The SHA rather than the branch
      # name, so the patch's base is the commit `render-commit` checks the branch against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # Two steps rather than one. The first is the only part of the payload this repository can
      # answer for itself — the configuration tables and the dialect they are written in, out of
      # the `Config` type. The second derives the rest from `Cargo.toml` and `docs/`, and
      # deep-merges the first over it, so the release, the licence and the documentation index
      # come from the files that already hold them.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(cargo run --quiet --features config-schema --example readme-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # `branch` names the default branch rather than taking its own default of `github.ref_name`.
      # On a pull_request event that is `<number>/merge`, which would render badge and permalink
      # URLs the push to master then disagrees with, and the gate below would fail on every merge
      # for a reason absent from the diff.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Written, not committed: the commit is `render-commit`'s, over every generated file at once.
      - name: Render the configuration page
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/CONFIGURATION.md.hbs
          output: docs/CONFIGURATION.md
          variables: ${{ steps.variables.outputs.variables }}

      - name: Render the README
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}

      # The recipe a developer runs, not a second spelling of the cargo invocation behind it, so a
      # contract only ever comes out of CI the way it comes out of a workstation.
      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      # No `--revision` or `--created`: they would make the document differ on every run and the
      # diff meaningless.
      - name: Regenerate the configuration contract
        run: just contract-json

      # Every generated path is named, so nothing else left dirty in the workspace rides along.
      # `render-commit` holds the same list as its allowlist and refuses a patch touching anything
      # outside it.
      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-create-patch-v1.1.0
        with:
          artifact_name: docs-render
          paths: README.md docs/CONFIGURATION.md docs/config.contract.json

  render-commit:
    name: Commit Render
    needs: render
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' && needs.render.outputs.has_changes == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Where ACTIONS_MAINTENANCE_APP_ID and ACTIONS_MAINTENANCE_PRIVATE_KEY live. Only this job,
    # which runs no repository code, gets it.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required to fetch the commit the patch applies to; the write uses the App token
    steps:
      # Nothing from the branch runs here, so the egress this job needs is known in full: GitHub
      # for the checkout, the token and the commit, and the artifact service for the patch.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # An App installation token, so the commit is verified and — unlike one made with
      # `GITHUB_TOKEN` — re-triggers the checks on the branch it lands on.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # Required to commit the patch to the pull request's branch

      # The artifact name is a literal, not the render job's output: that job ran the pull
      # request's code. One commit over every generated file, because a second commit would have to
      # name the head the first just moved. If `fmt-commit` committed first, the branch has moved
      # past the commit the patch was made from, and commit-patch skips it with
      # `outcome: branch_moved`; the new head starts a new run, which renders again.
      - name: Commit the generated documentation
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: docs-render
          # Exactly the files `render` writes; any other path fails this job.
          allowed_paths: 'README.md docs/CONFIGURATION.md docs/config.contract.json'
          commit_message: 'docs: regenerate the generated documentation and configuration contract'

      - name: Summarise
        env:
          OUTCOME: ${{ steps.commit.outputs.outcome }}
          COMMIT_URL: ${{ steps.commit.outputs.commit_url }}
        run: |
          case "${OUTCOME}" in
            committed) echo "Generated documentation and contract re-rendered: ${COMMIT_URL}" >> "$GITHUB_STEP_SUMMARY" ;;
            branch_moved) echo "The branch moved while rendering; the run for the new head renders again." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "The generated documentation and contract already matched their sources." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  check:
    name: README
    # The complement of `render`: it covers the pushes to `master` that no pull request rendered,
    # and the fork pull requests that could not be committed to. Between the two conditions every
    # event this workflow sees is handled by exactly one job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # Two steps rather than one. The first is the only part of the payload this repository can
      # answer for itself — the configuration tables and the dialect they are written in, out of
      # the `Config` type. The second derives the rest from `Cargo.toml` and `docs/`, and
      # deep-merges the first over it, so the release, the licence and the documentation index
      # come from the files that already hold them.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(cargo run --quiet --features config-schema --example readme-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # `branch` names the default branch rather than taking its own default of `github.ref_name`.
      # On a pull_request event that is `<number>/merge`, which would render badge and permalink
      # URLs the push to master then disagrees with, and the gate below would fail on every merge
      # for a reason absent from the diff.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Both write nothing; each fails with the first differing line when its output is stale.
      - name: Verify docs/CONFIGURATION.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/CONFIGURATION.md.hbs
          output: docs/CONFIGURATION.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true
