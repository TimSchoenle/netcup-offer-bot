name: Docs

# The generated documents are rendered and committed on a pull request by the `render` job in
# generate.yaml and by generate-commit.yaml. This workflow is the other direction: wherever
# nothing commits (a push to the default branch, a pull request from a fork) it renders in
# `check` mode, writing nothing and failing when a committed file is stale. Without it, editing
# a generated page directly would appear to work right up until the next pull request silently
# reverted it.

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  check:
    name: README
    # The complement of the `render` job in generate.yaml: it covers the pushes to `master` that no
    # pull request rendered, and the fork pull requests that could not be committed to.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      # Two steps rather than one. The first is the only part of the payload this repository can
      # answer for itself — the configuration tables and the dialect they are written in, out of
      # the `Config` type. The second derives the rest from `Cargo.toml` and `docs/`, and
      # deep-merges the first over it, so the release, the licence and the documentation index
      # come from the files that already hold them.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(cargo run --quiet --features config-schema --example readme-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # `branch` names the default branch rather than taking its own default of `github.ref_name`.
      # On a pull_request event that is `<number>/merge`, which would render badge and permalink
      # URLs the push to master then disagrees with, and the gate below would fail on every merge
      # for a reason absent from the diff.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-readme-variables-v2.1.4
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Both write nothing; each fails with the first differing line when its output is stale.
      - name: Verify docs/CONFIGURATION.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/CONFIGURATION.md.hbs
          output: docs/CONFIGURATION.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true
