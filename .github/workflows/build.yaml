name: Build

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-cargo-check-v1.1.6

  coverage:
    name: Coverage
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-coverage-codecov-v1.1.41
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2

  fmt:
    name: Auto Format
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    # Shared with docs.yaml rather than with the rest of this workflow: both jobs commit to the
    # pull request branch through the API, which rejects a commit whose parent has moved. Racing
    # them would fail one of the two for a reason its log does not explain, so they queue.
    concurrency:
      group: branch-writes-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Auto Format
        uses: TimSchoenle/actions/actions/rust/auto-format@0406974974a3aaf884e7c65866b091d266614b46 # tag=actions-rust-auto-format-v1.1.13
        with:
          bot_app_id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          bot_private_key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-clippy-v1.1.10


  # rustdoc, with warnings fatal. `cargo check` never runs the rustdoc lints, so a broken
  # intra-doc link or an unescaped backtick reaches the rendered page and nobody else's job
  # notices. `missing_docs` is in the lint table and fails `check` on its own.
  doc:
    name: Doc
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # Both feature sets. The contract section of the `config` module documentation renders only
      # under `config-schema`, and it links an item that does not exist without it, so each set
      # has a link the other cannot break.
      - name: Document
        run: |
          cargo doc --all-features --no-deps
          cargo doc --no-deps

      - name: Doctests
        run: cargo test --doc --all-features

  # The half of the crate `--all-features` never builds. `sentry` is a default feature, so every
  # other job here compiles the arm of `src/telemetry/sentry.rs` that has a client and none of
  # them compile the arm that does not. Without this, the build with no egress path to a third
  # party would break in a pull request that never mentions Sentry and stay broken until someone
  # tried to produce one.
  no-default-features:
    name: No Default Features
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Test
        run: cargo test --no-default-features

  # The reverse gate on the config contract: regenerate the committed document and the
  # Dockerfile's `LABEL` block from the Rust types and fail if either has drifted. A renamed key
  # or a renamed prefix then shows up in the pull request that renamed it, as a diff a reviewer
  # reads — one step earlier than the label check on the built image, and far cheaper.
  #
  # No toolchain setup: the runner image ships a current stable Rust, and this is a `cargo run`
  # of one example.
  config-contract:
    name: Config Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `image` is empty, so the two checks needing one are skipped and this job stays the
      # cheap half.
      - name: Check the committed contract and the Dockerfile LABEL region
        uses: TimSchoenle/actions/actions/rust/config-contract@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-config-contract-v1.2.0
        with:
          example: config-contract
          features: config-schema
          image: ''

  docker-build-test:
    name: Docker Build and Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Each architecture builds on a runner of its own architecture, so no QEMU
      # emulation layer is involved.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: netcup-offer-bot:test
          build-args: |
            version=test
            release=test
            vendor=Timmi6790
            VERSION=test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Exported from the same build graph the image came from, so the generator is not run a
      # second time at a second moment and the labels cannot describe a different document than
      # the one in the image. `VERSION` matches the image build's, because it reaches the
      # document's `app.version` field and the two copies are compared below.
      - name: Export the config contract
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker buildx build \
            --target contract-export \
            --platform "${PLATFORM}" \
            --output "type=local,dest=./contract-out" \
            --build-arg VERSION=test \
            .

      # The image, never the Dockerfile. A source diff cannot see a base image that overrode a
      # label, a `LABEL` line deleted on a branch nobody diffed, or a build argument that
      # silently failed to interpolate.
      #
      # The toolchain is here rather than at the top of the job because only this step needs
      # it, and `cache: false` because this job also builds an image: a restored cache is
      # writable by any branch, and caching in a job that produces a runtime artefact is the
      # cache-poisoning path zizmor flags. Only the generator is compiled, so there is nearly
      # nothing to save.
      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Verify the image carries the contract labels
        id: contract
        uses: TimSchoenle/actions/actions/rust/config-contract@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-config-contract-v1.2.0
        with:
          example: config-contract
          features: config-schema
          image: netcup-offer-bot:test

      # The cross-check the dropped `sha256` label would have bought. The build is the one place
      # that holds both copies, so it costs nothing here and is invisible everywhere else — a
      # stale in-image copy is exactly the failure nothing downstream can see.
      #
      # The path comes from the label rather than from a literal, which ties the two together: a
      # `COPY` that lands the document somewhere the label does not name fails right here. A
      # `FROM scratch` image has no shell, and `docker cp` does not need one.
      - name: Verify the in-image contract is the document that was exported
        env:
          # The label set the step above rendered, as JSON. Read through the environment
          # rather than interpolated into the script, which would be a shell injection
          # wearing a template's clothes.
          LABELS: ${{ steps.contract.outputs.labels }}
        run: |
          set -euo pipefail
          contract_path="$(printf '%s' "${LABELS}" | jq -r '.["dev.terrace.config.contract.path"]')"
          probe="$(docker create netcup-offer-bot:test)"
          docker cp "${probe}:${contract_path}" ./from-image.json
          docker rm "${probe}" > /dev/null
          cmp ./from-image.json ./contract-out/contract.json

      - name: Test Docker image runs
        run: |
          docker run --rm netcup-offer-bot:test --version || true

      - name: Check image size
        id: size-check
        run: |
          SIZE=$(docker image inspect netcup-offer-bot:test --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "Image size: ${SIZE}MB"
          if [ $SIZE -gt 150 ]; then
            echo "::warning::Image size (${SIZE}MB) exceeds 150MB threshold"
          fi

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: netcup-offer-bot:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # A distinct category per architecture keeps the matrix jobs from overwriting
      # each other's results in the security dashboard.
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ matrix.arch }}

      - name: Comment image size on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        env:
          SIZE: ${{ steps.size-check.outputs.size }}
          ARCH: ${{ matrix.arch }}
        with:
          script: |
            const { SIZE, ARCH } = process.env;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 Docker image size (\`linux/${ARCH}\`): **${SIZE}MB**`
            });

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0