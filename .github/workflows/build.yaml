name: Build

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@88e964d440835fd99f7e9d17b4ba1b48544303ba # tag=actions-rust-cargo-check-v1.1.7

  # The upload authenticates with this job's OIDC token, so the job needs neither the `ci`
  # environment nor its `CODECOV_TOKEN`. `.github/codecov.yml` decides what the Codecov statuses
  # check.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-rust-coverage-codecov-v2.0.4
        with:
          flags: rust

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2

  # Auto-format is split in two. `cargo fmt` honours the pull request's own `rust-toolchain.toml`
  # and `rustfmt.toml`, so this job runs code the pull request chose and holds no secret, no
  # environment and no write permission; it uploads what `cargo fmt` changed as a patch artifact.
  # `fmt-commit` below holds the App token and commits that patch, running no repository code.
  #
  # Pull requests only: a push to `master` has no pull request head to commit to.
  fmt:
    name: Auto Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    outputs:
      changes_detected: ${{ steps.format.outputs.changes_detected }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # The pull request head, not the default merge commit: the patch is committed to the branch,
      # so it has to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto Format
        id: format
        uses: TimSchoenle/actions/actions/rust/auto-format@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-rust-auto-format-v2.0.0
        with:
          artifact_name: rust-auto-format

  fmt-commit:
    name: Commit Format
    needs: fmt
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' && needs.fmt.outputs.changes_detected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Where ACTIONS_MAINTENANCE_APP_ID and ACTIONS_MAINTENANCE_PRIVATE_KEY live. Only this job,
    # which runs no repository code, gets it.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    # Shared with docs.yaml rather than with the rest of this workflow: both jobs commit to the
    # pull request branch through the API, which rejects a commit whose parent has moved. Racing
    # them would fail one of the two for a reason its log does not explain, so they queue.
    concurrency:
      group: branch-writes-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read # Required to fetch the commit the patch applies to; the write uses the App token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # An App installation token, so the commit is verified and re-triggers the checks on the
      # branch it lands on. Scoped to the one permission the commit needs.
      - name: Generate Bot Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # Required to commit the formatted files

      # `artifact_name` is spelled out rather than read from the format job's output, which a job
      # running pull request code produced. `allowed_paths` admits only Rust
      # sources, the only files `cargo fmt` rewrites; any other path fails this job and nothing is committed.
      - name: Commit Format
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.token.outputs.token }}
          artifact_name: rust-auto-format
          allowed_paths: '**/*.rs'
          commit_message: 'style: auto-format rust code'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The shared action only annotates findings; `-D warnings` is what fails the job on them.
      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-clippy-v1.1.13
        with:
          clippy_arguments: '--all-features --all-targets -- -D warnings'


  # rustdoc, with warnings fatal. `cargo check` never runs the rustdoc lints, so a broken
  # intra-doc link or an unescaped backtick reaches the rendered page and nobody else's job
  # notices. `missing_docs` is in the lint table and fails `check` on its own.
  doc:
    name: Doc
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Saved from `master` only, for the reason given at `Build Docker image`. A pull request
      # restores `master`'s entry and saved a ~300 MB one of its own that nothing read.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.event_name == 'push' }}

      # Both feature sets. The contract section of the `config` module documentation renders only
      # under `config-schema`, and it links an item that does not exist without it, so each set
      # has a link the other cannot break.
      - name: Document
        run: |
          cargo doc --all-features --no-deps
          cargo doc --no-deps

      - name: Doctests
        run: cargo test --doc --all-features

  # The half of the crate `--all-features` never builds. `sentry` is a default feature, so every
  # other job here compiles the arm of `src/telemetry/sentry.rs` that has a client and none of
  # them compile the arm that does not. Without this, the build with no egress path to a third
  # party would break in a pull request that never mentions Sentry and stay broken until someone
  # tried to produce one.
  no-default-features:
    name: No Default Features
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Saved from `master` only, as in `doc`.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Test
        run: cargo test --no-default-features

  # The reverse gate on the config contract: regenerate the committed document and the
  # Dockerfile's `LABEL` block from the Rust types and fail if either has drifted. A renamed key
  # or a renamed prefix then shows up in the pull request that renamed it, as a diff a reviewer
  # reads — one step earlier than the label check on the built image, and far cheaper.
  #
  # No toolchain setup step: this is a `cargo run` of one example, and the runner's rustup installs
  # the release `rust-toolchain.toml` pins on the first `cargo` invocation.
  config-contract:
    name: Config Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `image` is empty, so the two checks needing one are skipped and this job stays the
      # cheap half.
      - name: Check the committed contract and the Dockerfile LABEL region
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          example: config-contract
          features: config-schema
          image: ''

  docker-build-test:
    name: Docker Build and Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Each architecture builds on a runner of its own architecture, so no QEMU
      # emulation layer is involved.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Every build reads the layer cache of its architecture; only a push to `master` writes it.
      #
      # A pull request's export was never read back, not even by a re-run of the same commit, and
      # `master` never reads it either. It still counted against the repository's 10 GB Actions
      # cache, where GitHub makes room by evicting the least recently used entries, `master`'s
      # among them.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: netcup-offer-bot:test
          build-args: |
            version=test
            release=test
            vendor=Timmi6790
            VERSION=test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}

      # Exported from the same build graph the image came from, so the generator is not run a
      # second time at a second moment and the labels cannot describe a different document than
      # the one in the image. `VERSION` matches the image build's, because it reaches the
      # document's `app.version` field and the two copies are compared below.
      #
      # The same cache as the step above, read and not written. The image build takes cached
      # layers lazily: a layer it only needed to reference is never pulled onto the runner. A
      # plain `docker buildx build` here has no cache source, so on a run whose image came from
      # the cache it finds none of the contract stage locally and rebuilds it, toolchain and
      # dependencies included.
      - name: Export the config contract
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: contract-export
          outputs: type=local,dest=./contract-out
          build-args: |
            VERSION=test
          cache-from: type=gha,scope=${{ matrix.arch }}

      # The image, never the Dockerfile. A source diff cannot see a base image that overrode a
      # label, a `LABEL` line deleted on a branch nobody diffed, or a build argument that
      # silently failed to interpolate.
      #
      # The toolchain is here rather than at the top of the job because only this step needs
      # it, and `cache: false` because this job also builds an image: a restored cache is
      # writable by any branch, and caching in a job that produces a runtime artefact is the
      # cache-poisoning path zizmor flags. Only the generator is compiled, so there is nearly
      # nothing to save.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Verify the image carries the contract labels
        id: contract
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          example: config-contract
          features: config-schema
          image: netcup-offer-bot:test

      # The cross-check the dropped `sha256` label would have bought. The build is the one place
      # that holds both copies, so it costs nothing here and is invisible everywhere else — a
      # stale in-image copy is exactly the failure nothing downstream can see.
      #
      # The path comes from the label rather than from a literal, which ties the two together: a
      # `COPY` that lands the document somewhere the label does not name fails right here. A
      # `FROM scratch` image has no shell, and `docker cp` does not need one.
      - name: Verify the in-image contract is the document that was exported
        env:
          # The label set the step above rendered, as JSON. Read through the environment
          # rather than interpolated into the script, which would be a shell injection
          # wearing a template's clothes.
          LABELS: ${{ steps.contract.outputs.labels }}
        run: |
          set -euo pipefail
          contract_path="$(printf '%s' "${LABELS}" | jq -r '.["dev.terrace.config.contract.path"]')"
          probe="$(docker create netcup-offer-bot:test)"
          docker cp "${probe}:${contract_path}" ./from-image.json
          docker rm "${probe}" > /dev/null
          cmp ./from-image.json ./contract-out/contract.json

      - name: Test Docker image runs
        run: |
          docker run --rm netcup-offer-bot:test --version || true

      # Size warning above 150 MiB, Trivy scan, SARIF upload and the pull request report in one
      # step. `comment: summary` because a leg can only own a comment of its own: each one uploads
      # a fragment instead, and `Image Size Report` below posts one table for both architectures.
      #
      # `sarif-category` is the per-architecture category the inline upload used, so the matrix
      # legs still do not overwrite each other's results and the existing code-scanning alerts
      # stay under the category they were raised in rather than being orphaned by the derived
      # `trivy-linux-amd64`.
      - name: Check Docker image
        uses: TimSchoenle/actions/actions/docker/image-check@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-docker-image-check-v1.1.8
        with:
          image: netcup-offer-bot:test
          platform: ${{ matrix.platform }}
          comment: summary
          sarif-category: trivy-${{ matrix.arch }}

  # One pull request comment for every architecture, rendered from the fragments the matrix legs
  # uploaded. A job of its own because no leg can edit a comment another leg owns without racing
  # it, and `always()` so one failed leg does not cost the table the row of the other. Reporting
  # only: nothing should wait on it.
  image-size-report:
    name: Image Size Report
    runs-on: ubuntu-latest
    needs: docker-build-test
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read # Required by the summary action
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Comment image sizes on PR
        uses: TimSchoenle/actions/actions/docker/image-check-summary@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-docker-image-check-summary-v1.1.6

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0